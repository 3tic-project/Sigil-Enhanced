name: Build Sigil on Linux Distro

# Upstream only builds this on Ubuntu 24.04 with distro Qt 6.4, which cannot
# build the fork (Qt 6.10.2, bundled Lexbor, relocatable Python). Keep the
# workflow available manually instead of failing on every push.
on:
  workflow_dispatch:

jobs:
  build_on_distro:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: Build Sigil on Linux
    runs-on: ubuntu-latest

    container:
      image: ubuntu:24.04
      options: --privileged
      volumes:
        - ${{ github.workspace }}:/reporoot
      
    steps:
      - uses: actions/checkout@v6
      - run: bash /reporoot/.github/workflows/build_sigil_on_distro.sh 

