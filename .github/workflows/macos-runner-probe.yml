name: macOS runner probe

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/macos-runner-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    name: Probe ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-14, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Report runner facts
        run: |
          uname -m
          sw_vers
